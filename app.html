<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EasyBook — Intelligent Fleet Automation</title>
<meta name="description" content="EasyBook: AI-powered fleet management platform for car rental operators. Real-time tracking, predictive maintenance, and revenue intelligence."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="app.css"/>
</head>
<body>

<!-- Capybara Preloader (From Uiverse.io by Novaxlo) -->
<div class="preloader-overlay" id="preloader">
  <div class="capybaraloader">
    <div class="capybara">
      <div class="capy"></div>
      <div class="capyleg2"></div>
      <div class="capyleg2"></div>
      <div class="capyleg"></div>
      <div class="capyhead">
        <div class="capyear"><div class="capyear2"></div></div>
        <div class="capyear"><div class="capyear2"></div></div>
        <div class="capyeye"></div>
        <div class="capyeye"></div>
        <div class="capymouth">
          <div class="capylips"></div>
          <div class="capylips"></div>
        </div>
      </div>
    </div>
    <div class="loader">
      <div class="loaderline"></div>
    </div>
  </div>
  <div class="preloader-brand">
    Easy<span class="logo-accent">Book</span>
  </div>
  <div class="preloader-text">Loading platform...</div>
</div>

<!-- Background aurora effect -->
<div class="bg-aurora" aria-hidden="true">
  <div class="aurora-blob aurora-1"></div>
  <div class="aurora-blob aurora-2"></div>
  <div class="aurora-blob aurora-3"></div>
</div>

<!-- APP SHELL -->
<div id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <a href="#" class="logo-lockup" id="logo-link">
        <div class="logo-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M3 17l3-6h12l3 6H3z" fill="#2563eb"/>
            <path d="M4 17h16v3H4z" fill="#1d4ed8"/>
            <circle cx="7.5" cy="20" r="1.5" fill="#2563eb"/>
            <circle cx="16.5" cy="20" r="1.5" fill="#2563eb"/>
          </svg>
        </div>
        <span class="logo-text">EasyBook</span>
      </a>
      <button class="sidebar-close-btn" id="sidebar-close" aria-label="Close navigation">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="sidebar-section-label">Main</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-page="dashboard" id="nav-dashboard">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        </span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="fleet" id="nav-fleet">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
        </span>
        <span class="nav-label">Fleet</span>
        <span class="nav-count" id="fleet-badge">0</span>
      </a>
      <a href="#" class="nav-item" data-page="bookings" id="nav-bookings">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        </span>
        <span class="nav-label">Bookings</span>
        <span class="nav-count nav-count--alert" id="booking-badge">3</span>
      </a>
      <a href="#" class="nav-item" data-page="analytics" id="nav-analytics">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </span>
        <span class="nav-label">Analytics</span>
      </a>
    </nav>

    <div class="sidebar-section-label" style="margin-top:8px">More</div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item" data-page="landing" id="nav-landing">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
        </span>
        <span class="nav-label">Landing Page</span>
      </a>
      <a href="#" class="nav-item" data-page="settings" id="nav-settings">
        <span class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93l-1.41 1.41M5.34 18.66l-1.41 1.41M12 2v2M12 20v2M4.93 4.93l1.41 1.41M18.66 18.66l1.41 1.41M2 12h2M20 12h2"/></svg>
        </span>
        <span class="nav-label">Settings</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-divider"></div>
      <div class="user-card">
        <div class="user-avatar" style="background:linear-gradient(135deg,#2563eb,#7c3aed)">JD</div>
        <div class="user-details">
          <div class="user-name">James Doyle</div>
          <div class="user-role">Fleet Owner</div>
        </div>
        <div class="user-status-dot" title="Online"></div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <div class="main-wrapper" id="main-wrapper">

    <!-- Top Bar -->
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-btn" id="menu-toggle" aria-label="Toggle navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-breadcrumb" id="topbar-title">Dashboard</div>
      </div>
      <div class="topbar-center">
        <div class="search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="Search vehicles, bookings..." id="global-search" autocomplete="off"/>
          <kbd>⌘K</kbd>
        </div>
      </div>
      <div class="topbar-right">
        <div class="live-badge">
          <span class="live-dot"></span>
          Live
        </div>
        <button class="icon-btn" id="notif-btn" aria-label="Notifications">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-badge">3</span>
        </button>
        <div class="topbar-avatar" style="background:linear-gradient(135deg,#2563eb,#7c3aed)">JD</div>
      </div>
    </header>

    <!-- Page Content -->
    <main class="page-content" id="page-content"></main>
  </div>
</div>

<!-- Vehicle Modal -->
<div class="modal-backdrop" id="modal-overlay">
  <div class="modal" id="vehicle-modal" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 class="modal-title" id="modal-title">Add Vehicle</h3>
      <button class="modal-close-btn" id="modal-close" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form class="modal-body" id="vehicle-form" novalidate>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="v-name">Vehicle Name</label>
          <input class="field-input" type="text" id="v-name" placeholder="e.g. Tesla Model 3" required/>
        </div>
        <div class="field">
          <label class="field-label" for="v-plate">Plate Number</label>
          <input class="field-input" type="text" id="v-plate" placeholder="e.g. TX-4421" required/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="v-type">Category</label>
          <select class="field-input field-select" id="v-type">
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Electric">Electric</option>
            <option value="Luxury">Luxury</option>
            <option value="Van">Van</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="v-rate">Daily Rate (USD)</label>
          <input class="field-input" type="number" id="v-rate" placeholder="89" min="1" required/>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label class="field-label" for="v-status">Status</label>
          <select class="field-input field-select" id="v-status">
            <option value="Available">Available</option>
            <option value="Rented">Rented</option>
            <option value="Maintenance">Maintenance</option>
          </select>
        </div>
        <div class="field">
          <label class="field-label" for="v-location">Location</label>
          <input class="field-input" type="text" id="v-location" placeholder="Downtown Hub"/>
        </div>
      </div>
      <div class="field">
        <label class="field-label" for="v-mileage">Current Mileage</label>
        <input class="field-input" type="text" id="v-mileage" placeholder="e.g. 15,400 km"/>
      </div>

      <!-- Vehicle Photo (Upload or Capture) -->
      <div class="field">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <label class="field-label">Vehicle Photo</label>
          <span style="font-size:0.725rem;color:var(--text-muted)">Upload image or capture with camera</span>
        </div>

        <div class="photo-actions-row">
          <label class="btn btn-secondary btn-sm photo-btn" for="v-file-upload">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            Upload Photo
          </label>
          <input type="file" id="v-file-upload" accept="image/*" style="display:none;" />

          <button type="button" class="btn btn-secondary btn-sm photo-btn" id="v-camera-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Take Photo
          </button>
          <input type="file" id="v-camera-fallback" accept="image/*" capture="environment" style="display:none;" />

          <button type="button" class="btn btn-ghost btn-sm" id="v-photo-remove" style="display:none;color:var(--danger)">
            Remove
          </button>
        </div>

        <!-- Live Camera Stream -->
        <div id="camera-stream-wrap" class="camera-stream-wrap" style="display:none;">
          <video id="camera-video" autoplay playsinline muted></video>
          <div class="camera-controls">
            <button type="button" class="btn btn-primary btn-sm" id="camera-snap-btn">Snap Photo</button>
            <button type="button" class="btn btn-ghost btn-sm" id="camera-cancel-btn" style="background:rgba(255,255,255,0.88)">Cancel</button>
          </div>
          <canvas id="camera-canvas" style="display:none;"></canvas>
        </div>

        <!-- Photo Preview Area -->
        <div class="photo-preview-box" id="photo-preview-box" title="Click or drag an image here to upload">
          <div class="photo-placeholder" id="photo-placeholder">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>No photo selected &bull; Click to Upload or Take Photo</span>
          </div>
          <img id="photo-preview-img" class="photo-preview-img" alt="Vehicle preview" style="display:none;" />
        </div>

        <input type="hidden" id="v-image-data" value="" />
      </div>
      <div class="field">
        <label class="field-label" for="v-health">Health Score — <span id="v-health-val">92%</span></label>
        <input class="range-field" type="range" id="v-health" min="0" max="100" value="92"/>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Vehicle</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
